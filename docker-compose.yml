services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard
    restart: unless-stopped
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    env_file:
      - .env
    environment:
      SMTP_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: dashboard-postgres
    restart: unless-stopped
    ports:
      - ${DATABASE_PORT}:5432
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dashboard
    volumes:
      - postgres_prod_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U dashboard -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: dashboard-mailpit
    restart: unless-stopped
    ports:
      - ${MAILPIT_PORT}:${MAILPIT_PORT}
      - ${SMTP_PORT}:${SMTP_PORT}

volumes:
  postgres_prod_data:
