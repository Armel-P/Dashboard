name: Mirror Push
run-name: ${{ github.actor }}'s push

on:
  push:
    branches:
      - main

env:
  MIRROR_URL: git@github.com:EpitechPGE3-2026/G-WEB-500-BDX-5-1-dashboard-6.git
  MIRROR_REPO: EpitechPGE3-2026/G-WEB-500-BDX-5-1-dashboard-6

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: cp .env.example -env && docker compose -f docker-compose.yml build

  check_repository:
    runs-on: ubuntu-latest
    needs: [build]

    outputs:
      same_repo: ${{ steps.repo.outputs.same_repo }}

    steps:
      - name: Check repository's name
        id: repo
        run: |
          if [[ "${{ github.repository }}" == "${{ env.MIRROR_REPO }}" ]]; then
            echo "same_repo=true" >> $GITHUB_OUTPUT
          else
            echo "same_repo=false" >> $GITHUB_OUTPUT
          fi

  push_to_mirror:
    runs-on: ubuntu-latest
    needs: [build, check_repository]
    if: ${{ needs.check_repository.outputs.same_repo == 'false' && needs.build.result == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.MIRROR_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
