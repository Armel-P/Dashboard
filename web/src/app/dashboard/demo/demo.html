<app-shared-dashboard
  [freeMode]="true"
  (emptyChange)="isEmpty.set($event)"
/>

<div class="demo-empty-wrapper">
  @if (isEmpty()) {
    <header class="demo-heading">
      <div>
        <p class="eyebrow">INTERACTIVE DEMO</p>
        <h1>Your dashboard, your way.</h1>
        <p class="description">
          Explore the dashboard by adding widgets from available services.
          No account needed.
        </p>
      </div>
    </header>

    <section class="empty-state">
      <h2>Add your first widget</h2>
      <p>
        Your dashboard is empty for now. Choose a service and add a widget
        to bring your dashboard to life.
      </p>
      <button
        type="button"
        class="btn btn-primary"
        (click)="dashboardUiService.addOpen.set(true)"
      >
        + Add your first widget
      </button>
    </section>
  }
</div>
