[package]
name = "dashboard"
version = "0.1.0"
edition = "2024"

[dependencies]
# Dotenv
dotenvy = "0.15.7"

# Logger
env_logger = "0.11"
log = "0.4"

# HTTPS
openssl = "0.10.81"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
futures-util = "0.3"

# UUID
uuid = { version = "1.24", features = ["serde", "v4"] }

# Db
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "macros"] }

# Web
actix = "0.13"
actix-files = "0.7.0"
actix-web = { version = "4.14", features = ["openssl"] }
actix-ws = "0.4"

# Swagger UI documentation
utoipa = { version = "5.5", features = ["uuid", "macros"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }

# Error handling
anyhow = "1.0.104"
chrono = "0.4.45"
